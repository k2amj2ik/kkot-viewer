<script>
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const b=JSON.parse(document.getElementById('blob').textContent);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(b.salt),iterations:b.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(b.iv)},key,dec(b.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function go(){
  document.getElementById('err').textContent='';
  try{ await unlock(document.getElementById('pw').value); }
  catch(e){ document.getElementById('err').textContent='비밀번호가 틀렸어요'; }
}
document.getElementById('go').onclick=go;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script></body></html>
